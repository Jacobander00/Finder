<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Unit Finder (Mobile, On-Device)</title>
<style>
  :root { --ok:#22c55e; --bad:#ef4444; --dim:#6b7280; --ink:#111827; --bg:#0b0c10; --card:#111827; }
  html,body { margin:0; background:#0b0c10; color:#e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial; }
  header { padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; background:rgba(11,12,16,.85); backdrop-filter: blur(8px); z-index:3; border-bottom:1px solid #1f2937;}
  header h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  .pill { font-size:12px; color:#e5e7eb; border:1px solid #374151; padding:6px 10px; border-radius:999px; background:#0f172a; }
  main { padding:14px; display:grid; gap:12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  textarea, input[type=text] {
    width:100%; background:#0f172a; color:#e5e7eb; border:1px solid #334155; border-radius:10px; padding:10px 12px; font-size:15px; outline:none;
  }
  textarea { min-height:92px; resize:vertical; }
  button {
    background:#1f2937; color:#e5e7eb; border:1px solid #374151; padding:10px 14px; border-radius:999px; font-size:15px;
  }
  button:active { transform: translateY(1px); }
  .primary { background:#2563eb; border-color:#1d4ed8; }
  .good { background:#14532d; border-color:#166534; }
  .bad  { background:#7f1d1d; border-color:#991b1b; }
  .muted { background:#0f172a; color:#cbd5e1; }
  .seg { display:flex; border:1px solid #374151; border-radius:999px; overflow:hidden; }
  .seg button { border-radius:0; border:0; background:#0f172a; }
  .seg button.active { background:#2563eb; }
  video { width:100%; border-radius:12px; background:#000; max-height:48vh; object-fit:cover; }
  .stat { display:flex; align-items:center; gap:8px; font-size:14px; color:#cbd5e1; }
  .badge { font-weight:600; padding:2px 8px; border-radius:999px; background:#111827; border:1px solid #374151; }
  .list { background:#0f172a; border:1px solid #334155; border-radius:12px; padding:10px; max-height:30vh; overflow:auto; }
  .item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; border-bottom:1px dashed #1f2937; }
  .item:last-child { border-bottom:0; }
  .left { display:flex; align-items:center; gap:10px; min-width:0; }
  .tag { font-size:18px; width:28px; text-align:center; }
  .din { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#e5e7eb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .din strong { color:#fff; }
  .ok { color:var(--ok); }
  .no { color:var(--bad); }
  .hint { color:#94a3b8; font-size:13px; }
</style>
</head>
<body>
  <header>
    <div class="pill">Unit Finder • Mobile</div>
    <h1>Scan DINs &amp; Alert on Match</h1>
  </header>

  <main>
    <section>
      <div class="row">
        <textarea id="targets" placeholder="Paste or type target DINs here (one per line). Examples:
=W05152512345600
=E12345678901234"></textarea>
      </div>
      <div class="row">
        <div class="seg" role="tablist" aria-label="Mode">
          <button id="modeDetect" class="active" type="button">Camera</button>
          <button id="modeManual" type="button">Manual</button>
        </div>
        <button id="btnStart" class="primary" type="button">Start Camera</button>
        <button id="btnStop" class="muted" type="button">Stop</button>
        <button id="btnTorch" class="muted" type="button" title="Toggle flashlight">🔦 Torch</button>
        <button id="btnClear" class="muted" type="button">Clear Targets</button>
      </div>
      <div class="row"><span class="hint">Leading "=" will be ignored during matching. Matching is case-insensitive.</span></div>
    </section>

    <section id="cameraWrap">
      <video id="video" playsinline muted></video>
      <div class="row" style="justify-content:space-between">
        <div class="stat"><span class="badge" id="detectorStatus">Detector: …</span><span class="badge" id="torchStatus">Torch: n/a</span></div>
        <div class="stat">Last: <span id="last" class="badge">—</span></div>
      </div>
    </section>

    <section>
      <div class="row">
        <input id="manual" type="text" inputmode="latin" autocomplete="off" placeholder="Manual entry (or test): type a DIN and press Enter" />
      </div>
    </section>

    <section>
      <div class="list" id="log"></div>
    </section>
  </main>

<script>
(() => {
  const el = (id) => document.getElementById(id);

  const video = el('video');
  const targetsTA = el('targets');
  const manual = el('manual');
  const log = el('log');
  const lastBadge = el('last');
  const detectorStatus = el('detectorStatus');
  const torchStatus = el('torchStatus');

  const btnStart = el('btnStart');
  const btnStop = el('btnStop');
  const btnClear = el('btnClear');
  const btnTorch = el('btnTorch');
  const modeDetect = el('modeDetect');
  const modeManual = el('modeManual');

  // State
  let stream = null;
  let track = null;
  let imageCapture = null;
  let scanning = false;
  let haveTorch = false;
  let torchOn = false;

  // WebAudio chime (tiny on-the-fly)
  let audioCtx;
  function chime() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = "sine";
      o.frequency.setValueAtTime(880, now);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.2, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
      o.start(now);
      o.stop(now + 0.27);
    } catch(e) {}
  }
  function vibrateOK() { if (navigator.vibrate) navigator.vibrate([60,40,60]); }
  function vibrateNo() { if (navigator.vibrate) navigator.vibrate(50); }

  // Normalize DIN for matching
  const norm = (s) => (s || "")
      .trim()
      .replace(/^=/, "")      // remove leading '=' if present
      .replace(/\s+/g, "")    // remove whitespace
      .toUpperCase();

  function getTargetSet() {
    const lines = targetsTA.value.split(/\r?\n/).map(norm).filter(Boolean);
    return new Set(lines);
  }

  function addLogItem(scanned, matched) {
    const row = document.createElement('div');
    row.className = 'item';
    const left = document.createElement('div');
    left.className = 'left';
    const tag = document.createElement('div');
    tag.className = 'tag ' + (matched ? 'ok' : 'no');
    tag.textContent = matched ? '✅' : '❌';
    const text = document.createElement('div');
    text.className = 'din';
    text.innerHTML = matched
      ? `<strong>${scanned}</strong>`
      : scanned;
    left.appendChild(tag);
    left.appendChild(text);
    const time = document.createElement('div');
    time.className = 'hint';
    time.textContent = new Date().toLocaleTimeString();
    row.appendChild(left);
    row.appendChild(time);
    log.prepend(row);
    lastBadge.textContent = scanned;
    lastBadge.style.background = matched ? 'rgba(34,197,94,.15)' : 'rgba(239,68,68,.15)';
    lastBadge.style.border = matched ? '1px solid #14532d' : '1px solid #7f1d1d';
  }

  function onScanned(raw) {
    const s = norm(raw);
    if (!s) return;
    const targets = getTargetSet();
    const matched = targets.has(s);
    addLogItem(raw, matched);
    if (matched) { chime(); vibrateOK(); }
    else { vibrateNo(); }
  }

  // Manual input
  manual.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      onScanned(manual.value);
      manual.value = '';
    }
  });

  // Mode toggles
  function setMode(which) {
    if (which === 'camera') {
      modeDetect.classList.add('active');
      modeManual.classList.remove('active');
      btnStart.disabled = false;
    } else {
      modeManual.classList.add('active');
      modeDetect.classList.remove('active');
      btnStart.disabled = true;
      stopCamera();
    }
  }
  modeDetect.addEventListener('click', () => setMode('camera'));
  modeManual.addEventListener('click', () => setMode('manual'));

  // Torch
  async function updateTorchCapability() {
    try {
      if (!track) { haveTorch = false; torchStatus.textContent = 'Torch: n/a'; return; }
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      haveTorch = !!caps.torch;
      torchStatus.textContent = haveTorch ? `Torch: ${torchOn ? 'on' : 'off'}` : 'Torch: n/a';
    } catch { haveTorch = false; torchStatus.textContent = 'Torch: n/a'; }
  }
  async function toggleTorch() {
    if (!haveTorch || !track) return;
    try {
      torchOn = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      torchStatus.textContent = `Torch: ${torchOn ? 'on' : 'off'}`;
    } catch (e) {
      torchStatus.textContent = 'Torch: n/a';
    }
  }
  btnTorch.addEventListener('click', toggleTorch);

  // Camera + BarcodeDetector
  let detector = null;
  let useDetector = false;

  async function initDetector() {
    if ('BarcodeDetector' in window) {
      const formats = ['code_128', 'code_39', 'code_93', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'codabar', 'itf'];
      try {
        detector = new window.BarcodeDetector({ formats });
        useDetector = true;
        detectorStatus.textContent = 'Detector: built-in';
        return true;
      } catch {
        useDetector = false;
        detectorStatus.textContent = 'Detector: unavailable';
      }
    } else {
      useDetector = false;
      detectorStatus.textContent = 'Detector: unavailable';
    }
    return false;
  }

  async function startCamera() {
    if (scanning) return;
    await initDetector();
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      video.srcObject = stream;
      video.play();
      track = stream.getVideoTracks()[0];
      imageCapture = ('ImageCapture' in window) ? new ImageCapture(track) : null;
      scanning = true;
      await updateTorchCapability();
      loop();
    } catch (e) {
      detectorStatus.textContent = 'Camera blocked';
      console.error(e);
    }
  }

  async function stopCamera() {
    scanning = false;
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }
    stream = null;
    track = null;
    imageCapture = null;
    torchOn = false;
    torchStatus.textContent = 'Torch: n/a';
  }

  btnStart.addEventListener('click', startCamera);
  btnStop.addEventListener('click', stopCamera);
  btnClear.addEventListener('click', () => { targetsTA.value = ''; });

  // Scan loop
  let lastValue = '';
  let lastAt = 0;

  async function loop() {
    if (!scanning) return;
    try {
      if (useDetector && detector) {
        // Use the HTMLVideoElement frame as the source (supported by most UA)
        const barcodes = await detector.detect(video);
        if (barcodes && barcodes.length) {
          // Prefer longer Code128 values (DINs are long)
          barcodes.sort((a,b)=> (b.rawValue?.length||0) - (a.rawValue?.length||0));
          const raw = barcodes[0].rawValue || '';
          const now = performance.now();
          if (raw && (raw !== lastValue || (now - lastAt) > 1200)) {
            lastValue = raw; lastAt = now;
            onScanned(raw);
          }
        }
      }
    } catch (e) {
      // If detection fails intermittently, just keep looping
      //console.warn(e);
    }
    requestAnimationFrame(loop);
  }

  // Permissions hint / initial mode
  setMode('camera');
})();
</script>
</body>
</html>
